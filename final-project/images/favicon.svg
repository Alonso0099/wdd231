<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Tile background -->
  <rect width="64" height="64" rx="14" fill="#f8f1e7" />

  <!-- Container body -->
  <rect x="8" y="22" width="48" height="32" rx="5" fill="#2f5d50" />

  <!-- Lid -->
  <rect x="6" y="14" width="52" height="12" rx="5" fill="#b56b45" />

  <!-- Lid highlight strip -->
  <rect x="6" y="14" width="52" height="4" rx="5" fill="#7f432c" opacity="0.3" />

  <!-- Lid handle -->
  <rect x="26" y="10" width="12" height="6" rx="3" fill="#b56b45" />
  <rect x="26" y="10" width="12" height="3" rx="3" fill="#7f432c" opacity="0.2" />

  <!-- Interior divider vertical -->
  <line x1="32" y1="25" x2="32" y2="51" stroke="#23463c" stroke-width="1.5" opacity="0.4" />

  <!-- Interior divider horizontal -->
  <line x1="10" y1="38" x2="30" y2="38" stroke="#23463c" stroke-width="1.5" opacity="0.4" />

  <!-- Food section: grain / rice -->
  <circle cx="16" cy="30" r="2.2" fill="#f8f1e7" opacity="0.55" />
  <circle cx="22" cy="29" r="1.8" fill="#f8f1e7" opacity="0.45" />
  <circle cx="19" cy="33" r="2" fill="#f8f1e7" opacity="0.5" />

  <!-- Food section: veggies -->
  <rect x="11" y="40" width="6" height="4" rx="1.5" fill="#b56b45" opacity="0.7" />
  <rect x="19" y="41" width="5" height="3" rx="1.5" fill="#b56b45" opacity="0.55" />

  <!-- Food section: protein -->
  <ellipse cx="47" cy="38" rx="8" ry="5.5" fill="#f8f1e7" opacity="0.35" />
  <ellipse cx="47" cy="37.5" rx="5" ry="3.5" fill="#f8f1e7" opacity="0.4" />

  <!-- Subtle sheen -->
  <rect x="8" y="22" width="48" height="5" rx="5" fill="#f8f1e7" opacity="0.07" />
</svg>